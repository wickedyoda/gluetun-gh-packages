services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${GLUETUN_CONTROL_PORT:-8000}:8000/tcp"
      - "${GLUETUN_HTTP_PROXY_PORT:-8888}:8888/tcp"
      - "${GLUETUN_SHADOWSOCKS_PORT:-8388}:8388/tcp"
      - "${GLUETUN_SHADOWSOCKS_PORT:-8388}:8388/udp"
    volumes:
      - "${GLUETUN_STATE_DIR:-./gluetun}:/gluetun"
    environment:
      TZ: "${TZ:-UTC}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"

      VPN_SERVICE_PROVIDER: "${VPN_SERVICE_PROVIDER:-}"
      VPN_TYPE: "${VPN_TYPE:-wireguard}"

      OPENVPN_USER: "${OPENVPN_USER:-}"
      OPENVPN_PASSWORD: "${OPENVPN_PASSWORD:-}"

      WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY:-}"
      WIREGUARD_ADDRESSES: "${WIREGUARD_ADDRESSES:-}"
      WIREGUARD_MTU: "${WIREGUARD_MTU:-}"

      SERVER_COUNTRIES: "${SERVER_COUNTRIES:-}"
      SERVER_CITIES: "${SERVER_CITIES:-}"
      SERVER_HOSTNAMES: "${SERVER_HOSTNAMES:-}"

      FIREWALL_OUTBOUND_SUBNETS: "${FIREWALL_OUTBOUND_SUBNETS:-}"

      DNS_UPSTREAM_RESOLVER_TYPE: "${DNS_UPSTREAM_RESOLVER_TYPE:-DoT}"
      DNS_UPSTREAM_RESOLVERS: "${DNS_UPSTREAM_RESOLVERS:-}"
      DNS_UPSTREAM_PLAIN_ADDRESSES: "${DNS_UPSTREAM_PLAIN_ADDRESSES:-}"
      BLOCK_MALICIOUS: "${BLOCK_MALICIOUS:-on}"
      BLOCK_ADS: "${BLOCK_ADS:-off}"
      BLOCK_SURVEILLANCE: "${BLOCK_SURVEILLANCE:-off}"

      HEALTH_RESTART_VPN: "${HEALTH_RESTART_VPN:-on}"
      HEALTH_TARGET_ADDRESSES: "${HEALTH_TARGET_ADDRESSES:-1.1.1.1:443,8.8.8.8:443}"
      HEALTH_SMALL_CHECK_TYPE: "${HEALTH_SMALL_CHECK_TYPE:-icmp}"
      HEALTH_ICMP_TARGET_IPS: "${HEALTH_ICMP_TARGET_IPS:-1.1.1.1,8.8.8.8}"

      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
      HTTP_CONTROL_SERVER_LOG: "${HTTP_CONTROL_SERVER_LOG:-on}"

      HTTPPROXY: "${HTTPPROXY:-off}"
      HTTPPROXY_LOG: "${HTTPPROXY_LOG:-off}"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"

      SHADOWSOCKS: "${SHADOWSOCKS:-off}"
      SHADOWSOCKS_LOG: "${SHADOWSOCKS_LOG:-off}"
      SHADOWSOCKS_LISTENING_ADDRESS: ":8388"
      SHADOWSOCKS_PASSWORD: "${SHADOWSOCKS_PASSWORD:-}"

      UPDATER_PERIOD: "${UPDATER_PERIOD:-24h}"

    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
